<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任務中心｜日常安排</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#24291f;background:#f4f5ef}*{box-sizing:border-box}body{margin:0;min-width:320px;line-height:1.6}main{width:min(100% - 48px,1000px);margin:auto;padding:24px 0 64px;animation:enter .32s ease}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}nav{position:sticky;top:12px;z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-bottom:42px;padding:10px;border:1px solid #e7e9e1;border-radius:16px;background:#ffffffed;box-shadow:0 8px 28px #24291f0c;backdrop-filter:blur(14px)}nav a{padding:9px 13px;border-radius:10px;color:#676d62;text-decoration:none;font-size:.9rem;font-weight:650;transition:.18s}nav a:hover,nav a[aria-current=page]{background:#eaf0e5;color:#4f6841}h1{margin:0;font-size:clamp(2rem,4vw,3rem);letter-spacing:-.04em;line-height:1.2}.lead{margin:10px 0 0;color:#73796e}.card{margin-top:24px;padding:26px;border:1px solid #e7e9e1;border-radius:19px;background:#fff;box-shadow:0 10px 28px #24291f0e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric{padding:18px;border:1px solid #edf0e9;border-radius:15px;background:#fafbf8}.metric strong{display:block;color:#4f6841;font-size:1.65rem;letter-spacing:-.03em}.item{padding:14px 0;border-bottom:1px solid #edf0e9}.item:last-child{border-bottom:0}.tip{margin-top:18px;padding:14px 16px;border-radius:12px;background:#f0f4ec;color:#4a6240;line-height:1.65}button{transition:transform .18s,background .18s}button:hover{transform:translateY(-1px)}input[type=date]{max-width:100%;min-height:44px;padding:9px 12px;border:1px solid #e2e5dc;border-radius:10px;font:inherit}input:focus{outline:3px solid #e8efe2;border-color:#82966f}@media(max-width:600px){main{width:calc(100% - 24px);padding-top:14px}nav{position:static;margin-bottom:30px;gap:2px}nav a{padding:8px 9px;font-size:.82rem}.card{padding:19px}.grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}</style></head><body><main><nav><a href="index.html">🏠 今日總覽</a><a href="calendar.html">📅 行事曆</a><a href="tasks.html" aria-current="page">✅ 任務中心</a><a href="about.html">ℹ️ 使用說明</a></nav><h1>任務中心</h1><p class="lead">查看並更新所有待辦，狀態會同步到今日總覽。</p><section class="card"><div class="grid"><div class="metric"><strong id="total">0</strong>全部任務</div><div class="metric"><strong id="completed">0</strong>已完成</div><div class="metric"><strong id="rate">0%</strong>完成率</div></div><div id="tasks"></div><p class="tip">勾選任務即可更新狀態，按移除則刪除該任務。</p></section></main><script>const root=document.querySelector("#tasks");function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function read(){try{return JSON.parse(localStorage.getItem("daily-planner-tasks-v2")||"[]")}catch{return []}}function render(){const items=read(),done=items.filter(x=>x.done).length;document.querySelector("#total").textContent=items.length;document.querySelector("#completed").textContent=done;document.querySelector("#rate").textContent=items.length?Math.round(done/items.length*100)+"%":"0%";root.innerHTML=items.length?items.map(x=>`<div class="item" style="display:flex;align-items:center;gap:12px"><input type="checkbox" data-id="${esc(x.id)}" ${x.done?"checked":""}><span style="flex:1;${x.done?"text-decoration:line-through;opacity:.6":""}">${esc(x.title)}</span><button data-remove="${esc(x.id)}">移除</button></div>`).join(""):"<p class=tip>目前沒有待辦事項，請回總覽新增。</p>"}root.addEventListener("change",e=>{if(!e.target.matches("input[type=checkbox]"))return;const items=read().map(x=>x.id===e.target.dataset.id?{...x,done:e.target.checked,status:e.target.checked?"done":"pending"}:x);localStorage.setItem("daily-planner-tasks-v2",JSON.stringify(items));render()});root.addEventListener("click",e=>{if(!e.target.dataset.remove)return;localStorage.setItem("daily-planner-tasks-v2",JSON.stringify(read().filter(x=>x.id!==e.target.dataset.remove)));render()});render();</script></body></html>
