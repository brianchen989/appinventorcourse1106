<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行事曆｜日常安排</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#24291f;background:#f4f5ef}*{box-sizing:border-box}body{margin:0;min-width:320px;line-height:1.6}main{width:min(100% - 48px,1000px);margin:auto;padding:24px 0 64px;animation:enter .32s ease}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}nav{position:sticky;top:12px;z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-bottom:42px;padding:10px;border:1px solid #e7e9e1;border-radius:16px;background:#ffffffed;box-shadow:0 8px 28px #24291f0c;backdrop-filter:blur(14px)}nav a{padding:9px 13px;border-radius:10px;color:#676d62;text-decoration:none;font-size:.9rem;font-weight:650;transition:.18s}nav a:hover,nav a[aria-current=page]{background:#eaf0e5;color:#4f6841}h1{margin:0;font-size:clamp(2rem,4vw,3rem);letter-spacing:-.04em;line-height:1.2}.lead{margin:10px 0 0;color:#73796e}.card{margin-top:24px;padding:26px;border:1px solid #e7e9e1;border-radius:19px;background:#fff;box-shadow:0 10px 28px #24291f0e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric{padding:18px;border:1px solid #edf0e9;border-radius:15px;background:#fafbf8}.metric strong{display:block;color:#4f6841;font-size:1.65rem;letter-spacing:-.03em}.item{padding:14px 0;border-bottom:1px solid #edf0e9}.item:last-child{border-bottom:0}.tip{margin-top:18px;padding:14px 16px;border-radius:12px;background:#f0f4ec;color:#4a6240;line-height:1.65}button{transition:transform .18s,background .18s}button:hover{transform:translateY(-1px)}input[type=date]{max-width:100%;min-height:44px;padding:9px 12px;border:1px solid #e2e5dc;border-radius:10px;font:inherit}input:focus{outline:3px solid #e8efe2;border-color:#82966f}@media(max-width:600px){main{width:calc(100% - 24px);padding-top:14px}nav{position:static;margin-bottom:30px;gap:2px}nav a{padding:8px 9px;font-size:.82rem}.card{padding:19px}.grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}</style></head><body><main><nav><a href="index.html">🏠 今日總覽</a><a href="calendar.html" aria-current="page">📅 行事曆</a><a href="tasks.html">✅ 任務中心</a><a href="about.html">ℹ️ 使用說明</a></nav><h1>行事曆</h1><p class="lead">選擇日期查看已安排的活動。</p><section class="card"><label for="calendar-date">選擇日期</label><p><input id="calendar-date" type="date" style="padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit"></p><div class="grid"><div class="metric"><strong id="count">0</strong>項行程</div><div class="metric"><strong id="weekday">—</strong>星期</div></div><div id="events"></div><p class="tip">行程儲存在此瀏覽器。新增或刪除行程請回到總覽。</p></section></main><script>const d=document.querySelector("#calendar-date"),list=document.querySelector("#events"),fmt=x=>[x.getFullYear(),String(x.getMonth()+1).padStart(2,"0"),String(x.getDate()).padStart(2,"0")].join("-");d.value=new URLSearchParams(location.search).get("date")||fmt(new Date());function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}function render(){let items=[];try{items=JSON.parse(localStorage.getItem("daily-planner-events-v2")||"[]")}catch{}const selected=items.filter(x=>x.date===d.value).sort((a,b)=>a.time.localeCompare(b.time));document.querySelector("#count").textContent=selected.length;document.querySelector("#weekday").textContent=new Intl.DateTimeFormat("zh-TW",{weekday:"long"}).format(new Date(d.value+"T00:00:00"));list.innerHTML=selected.length?selected.map(x=>`<div class="item"><strong>${esc(x.time)} · ${esc(x.title)}</strong><div>${esc(x.location||"未指定地點")}</div></div>`).join(""):"<p class=tip>這一天還沒有行程。</p>"}d.addEventListener("change",render);render();</script></body></html>
